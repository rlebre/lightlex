name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Build
        run: yarn build
