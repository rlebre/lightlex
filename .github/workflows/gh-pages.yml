name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Node and pnpm (mise.toml)
        uses: jdx/mise-action@v5

      - name: Install and Build 🔧
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
